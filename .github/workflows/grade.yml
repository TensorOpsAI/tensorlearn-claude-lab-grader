name: TensorLearn workshop grader
on:
  workflow_call:
    inputs:
      exercise-key:
        required: true
        type: string
      grader-sha:
        required: true
        type: string
      layout:
        required: false
        type: string
        default: monorepo
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  lab-grade:
    name: lab-grade
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preload isolated worker for code assessment
        if: contains(fromJSON('["bug-fix","skills","evals","incident","hooks","recurring-regressions","subagents"]'), inputs.exercise-key)
        run: docker pull node:22.18.0-alpine@sha256:1b2479dd35a99687d6638f5976fd235e26c5b37e8122f786fcd5fe231d63de5b
      - name: Stage trusted grade.py part 1
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('grade.py')
          p.parent.mkdir(parents=True,exist_ok=True)
          with p.open('wb') as f: f.write(base64.b64decode(''))
      - name: Stage trusted grade.py part 2
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('grade.py')
          p.parent.mkdir(parents=True,exist_ok=True)
          with p.open('ab') as f: f.write(base64.b64decode(''))
